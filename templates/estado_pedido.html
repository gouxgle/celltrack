<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <title>CellTrack - Estado</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script> -->
</head>
<body>
    <div class="container">
        <form method="POST" class="pedido-form">
            <button type="submit" formaction="{{ url_for('login.login') }}" name="accion" value="cerrar" class="cerrar-sesion">Cerrar Sesión</button>
            <img src="{{ url_for('static', filename='Logo_REFSA.jpg') }}" alt="Logo REFSA" class="logo-pm">
            <h1 class="title">SISTEMA DE ALMACENES REFSA</h1>
            <h2 class="tarea">ESTADO DE PEDIDOS</h2>
            <h3 class="title">Usuario: {{ usuario }}</h3>

            <!-- Filtro por tipo de pedido -->
            <div class="form-row">
                <div class="form-group">
                    <label for="tipoPedido">Filtrar por tipo:</label>
                    <select id="tipoPedido" class="form-control">
                        <option value="">-- Seleccionar tipo --</option>
                        <option value="pim">Pedido Interno</option>
                        <option value="retiro">Retiro de Materiales</option>
                        <option value="transferencia">Transferencias Internas</option>
                    </select>
                </div>
            </div>

            <!-- Resultados -->
            <div id="tablaPedidosContainer" style="display: none;">
                <h2>📋 Detalle de Pedidos</h2>
                <table class="table table-bordered table-striped">
                    <thead>
                        <tr id="thead-pedidos">
                            <!-- Encabezados dinámicos -->
                        </tr>
                    </thead>
                    <tbody id="tbody-pedidos">
                        <!-- Filas dinámicas -->
                    </tbody>
                </table>
            </div>
        </form>
    </div>

    <script>
        const headersMap = {
            pim: ["# P.I.M.", "Material", "Cant. Pedida", "Fecha", "Estado", "Cant. Ingresada", "O.C.", "# O.C."],
            retiro: ["# R.M.", "Material", "Cant. Pedida", "Fec Entrega", "Estado", "Cant. Entregada", "Entregado por", "Item"],
            transferencia: ["Material", "Cantidad Pasada"]
        };

        const camposMap = {
            pim: ["renglon", "material", "cantidad", "fecharealizpedido", "estado", "cantidadingresada", "ordendecompra", "renglonodc"],
            retiro: ["renglon", "material", "cantidad", "fecha", "estado", "cantidadretirada", "quienentrego", "renglon"],
            transferencia: ["material", "cantidad"]
        };

        document.getElementById("tipoPedido").addEventListener("change", function () {
            const tipo = this.value;
            if (!tipo) return;

            fetch(`/estado_pedido/detalles?tipo=${tipo}`)
                .then(res => res.json())
                .then(data => {
                    const thead = document.getElementById("thead-pedidos");
                    const tbody = document.getElementById("tbody-pedidos");
                    thead.innerHTML = "";
                    tbody.innerHTML = "";

                    headersMap[tipo].forEach(header => {
                        const th = document.createElement("th");
                        th.textContent = header;
                        thead.appendChild(th);
                    });

                    if (data.length === 0) {
                        const tr = document.createElement("tr");
                        const td = document.createElement("td");
                        td.colSpan = headersMap[tipo].length;
                        td.textContent = "No hay resultados disponibles.";
                        tr.appendChild(td);
                        tbody.appendChild(tr);
                    } else {
                        data.forEach(row => {
                            const tr = document.createElement("tr");
                            camposMap[tipo].forEach(campo => {
                                const td = document.createElement("td");
                                td.textContent = row[campo] || "";
                                tr.appendChild(td);
                            });
                            tbody.appendChild(tr);
                        });
                    }

                    document.getElementById("tablaPedidosContainer").style.display = "block";
                });
        });
    </script>
</body>
</html>
